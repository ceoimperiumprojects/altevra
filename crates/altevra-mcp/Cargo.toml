[package]
name = "altevra-mcp"
version = "0.1.0"
edition = "2021"

[features]
# Enables semantic (BGE-M3 vector) file search in the MCP `search_files` tool.
# Off by default; the `altevra` binary turns it on via `--features embedding`.
embedding = ["altevra-memory/embedding"]

[dependencies]
altevra-core = { workspace = true }
altevra-skills = { workspace = true }
altevra-hooks = { workspace = true }
altevra-bootstrap = { workspace = true }
altevra-vault = { workspace = true }
walkdir = { workspace = true }
altevra-memory = { workspace = true }
altevra-db = { workspace = true }
altevra-research = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
