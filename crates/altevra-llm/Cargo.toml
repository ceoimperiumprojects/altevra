[package]
name = "altevra-llm"
version = "0.3.0"
edition = "2021"
license = "LicenseRef-PolyForm-Strict-1.0.0"
description = "Altevra LLM provider abstraction — chat + embedding traits with multi-provider routing"
repository = "https://github.com/ceoimperiumprojects/altevra"

[dependencies]
altevra-core = { workspace = true }
altevra-secrets = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
