[package]
name = "altevra-brain"
version = "0.1.0"
edition = "2021"

[dependencies]
altevra-core = { workspace = true }
altevra-db = { workspace = true }
altevra-llm = { workspace = true }
altevra-mcp = { workspace = true }
altevra-memory = { workspace = true }
altevra-research = { workspace = true }
altevra-secrets = { workspace = true }
# P3c skill_judge: bounded SkillEdit ops + fingerprint + skill-dir scan.
altevra-skills = { workspace = true }
altevra-vault = { workspace = true }
reqwest = { workspace = true }
# P3c: the SuccessJudge trait is async (mockable in tests with no HTTP).
async-trait = { workspace = true }
# P3c: the judge reads [llm].local_private from ~/.altevra/config.toml.
toml = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
# P4 notify delivery — claim-file names hash the dedup key (never a name in a filename).
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
async-trait = { workspace = true }
# C8 adversarial vertical-loop test renders a triaged skill into a TempDir to
# pin the TEMP-DIR-only external-effects boundary; needs the C4 factory.
altevra-adapters = { workspace = true }
