[package]
name = "altevra-memory"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Local hybrid embedding lane: BGE-M3 (fastembed/ONNX) dense vectors stored in
# sqlite-vec. OFF by default — pulls onnxruntime + a static sqlite-vec build.
embedding = ["dep:fastembed", "dep:rusqlite", "dep:sqlite-vec"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
pulldown-cmark = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
altevra-core = { workspace = true }
altevra-vault = { workspace = true }
altevra-secrets = { workspace = true }

# Optional — only compiled with feature `embedding`.
# rusqlite pinned to 0.29 to match altevra-cli (one libsqlite3-sys, links="sqlite3").
fastembed = { version = "5", optional = true }
rusqlite = { version = "0.29", features = ["bundled"], optional = true }
sqlite-vec = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
