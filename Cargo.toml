[workspace]
resolver = "2"
package.version = "0.3.0"
package.edition = "2021"
package.authors = ["Pavle Anđelković <ceoimperiumprojects@gmail.com>"]
package.license = "LicenseRef-PolyForm-Strict-1.0.0"
package.repository = "https://github.com/ceoimperiumprojects/Altevra"
package.homepage = "https://github.com/ceoimperiumprojects/Altevra"
package.description = "Local-first omniscient brain layer for AI tools. Source-available, PolyForm Strict licensed."
members = [
    "crates/altevra-core",
    "crates/altevra-cli",
    "crates/altevra-db",
    "crates/altevra-skills",
    "crates/altevra-hooks",
    "crates/altevra-adapters",
    "crates/altevra-bootstrap",
    "crates/altevra-mcp",
    "crates/altevra-vault",
    "crates/altevra-memory",
    "crates/altevra-research",
    "crates/altevra-secrets",
    "crates/altevra-watcher",
    "crates/altevra-brain",
    "crates/altevra-llm",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono", "json", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
config = "0.14"
toml = "0.8"
toml_edit = "0.22"
sha2 = "0.10"
hex = "0.4"
pulldown-cmark = "0.11"
regex = "1"
async-trait = "0.1"
futures = "0.3"
scraper = "0.20"
keyring = "3"
chacha20poly1305 = "0.10"
rpassword = "7"
walkdir = "2"
strsim = "0.11"
notify = "6"
feed-rs = "2"
altevra-core = { path = "crates/altevra-core" }
altevra-db = { path = "crates/altevra-db" }
altevra-skills = { path = "crates/altevra-skills" }
altevra-hooks = { path = "crates/altevra-hooks" }
altevra-adapters = { path = "crates/altevra-adapters" }
altevra-bootstrap = { path = "crates/altevra-bootstrap" }
altevra-mcp = { path = "crates/altevra-mcp" }
altevra-vault = { path = "crates/altevra-vault" }
altevra-memory = { path = "crates/altevra-memory" }
altevra-research = { path = "crates/altevra-research" }
altevra-secrets = { path = "crates/altevra-secrets" }
altevra-watcher = { path = "crates/altevra-watcher" }
altevra-brain = { path = "crates/altevra-brain" }
altevra-llm = { path = "crates/altevra-llm" }
tempfile = "3"
indicatif = "0.17"
rusqlite = { version = "0.29", features = ["bundled"] }
